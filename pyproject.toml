[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transcription-agent-eval"
version = "0.1.0"
description = "Eval-first benchmark for a meeting transcript agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
openai = ["openai>=1.50"]
langfuse = ["langfuse>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]
inspect = ["inspect-ai>=0.3"]

[project.scripts]
meeting-eval = "transcription_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Typer's documented CLI pattern uses Option calls as defaults. The benchmark
# runner intentionally isolates per-case provider failures so a run can finish.
ignore = ["B008", "BLE001"]
